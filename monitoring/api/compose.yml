
services:
  go-api:
    build: ./go-api
    ports:
      - "8081:8080"
      - "6060:6060"
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          cpus: "0.5"
          memory: 128M

  go-api-v2:
    build: ./go-api-v2
    ports:
      - "8085:8080"
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          cpus: "0.5"
          memory: 128M
    # ulimits:
    #   nofile:
    #     soft: 65535
    #     hard: 65535

  node-api:
    build: ./node-api
    ports:
      - "8082:8080"
    networks:
      - monitoring
    environment:
      NODE_ENV: production
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          cpus: "0.5"
          memory: 128M

  fastapi-api:
    build: ./fastapi-api
    ports:
      - "8083:8080"
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          cpus: "0.5"
          memory: 128M
  
  java-api:
    build: ./java-api
    ports:
      - "8084:8080"
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          cpus: "0.5"
          memory: 128M

networks:
  monitoring:
    external: true

## Create an external network
# docker network create monitoring

## Show container stats
# docker stats 0a7d33a684c2 6cfbc0b43488 d82902d1b6d6

